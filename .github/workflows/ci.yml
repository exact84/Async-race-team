name: CI Pipeline

on:
  push:
    branches:
      - main
      - development
      - 'feature/*'
      - 'fix/*'
      - 'chore/*'
      - 'refactor/*'
  pull_request:
    branches:
      - main
      - development

jobs:
  validate-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        run: |
          BRANCH_NAME="${{ github.head_ref }}"

          if [[ ! "$BRANCH_NAME" =~ ^(feature|fix|chore|refactor)/[a-z0-9._-]+$ ]]; then
            echo "❌ Invalid branch name: $BRANCH_NAME"
            echo "Allowed patterns: feature/*, fix/*, chore/* or refactor"
            exit 1
          fi

          echo "✅ Branch name is valid: $BRANCH_NAME"

  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build
